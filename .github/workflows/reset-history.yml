name: Reset confirmed repository history
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: confirmed-history-reset
  cancel-in-progress: false
jobs:
  reset:
    if: github.repository == 'vulnerablecodes/music-production'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Preserve current files in one new root commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          git config user.name "vulnerablecodes"
          git config user.email "39342130+vulnerablecodes@users.noreply.github.com"
          git checkout --orphan vintage-military-radio-clean
          git rm --cached -r .
          rm .github/workflows/reset-history.yml
          git add -A
          git commit -m "Vintage Military Radio v1.0.8 initial source and showcase"
          git push --force-with-lease=refs/heads/main:$GITHUB_SHA origin HEAD:refs/heads/main
          git push --force-with-lease=refs/tags/v1.0.8:a2e498e7671fdee42f38379cd47c2fb7e82e7f2a origin HEAD:refs/tags/v1.0.8
